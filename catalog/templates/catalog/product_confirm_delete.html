<!DOCTYPE html>
<html>
<head>
    <title>Удалить продукт</title>
</head>
<body>
    <h1>Удалить продукт</h1>
    <p>Вы уверены, что хотите удалить "{{ product.name }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit">Удалить</button>
    </form>
    <a href="{% url 'catalog:product_list' %}">Отмена</a>
</body>
</html>
