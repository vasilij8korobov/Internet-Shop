{% extends 'catalog/base.html' %}

{% block title %}Подтверждение удаления{% endblock %}

{% block content %}
<h1>Подтверждение удаления</h1>
<p>Вы уверены, что хотите удалить продукт "{{ object.name }}"?</p>
<form method="post">
    {% csrf_token %}
    <button type="submit">Удалить</button>
    <a href="{% url 'catalog:home' %}">Отменить</a>
</form>
{% endblock %}
